# Alembic configuration for Personal OS.
#
# Source of truth: ADR-002 (Persistence & ORM Strategy).
#
# This file intentionally contains NO database URL and NO secrets.
# sqlalchemy.url is left blank on purpose: env.py (see
# src/personal_os/database/migrations/env.py) resolves the actual URL
# at runtime from either
#   (a) an Alembic Config object's "sqlalchemy.url" main option, set
#       programmatically by a caller (the future Repository/runtime
#       layer, or a test) before invoking an Alembic command, or
#   (b) the PERSONAL_OS_DATABASE_URL environment variable, for direct
#       `alembic <cmd>` CLI use.
# Neither Personal Data nor any real database path belongs in this
# file, and ~/PersonalOS-data/personal_os.db must never be referenced
# here (see SECURITY.md).

[alembic]
# Migration scripts live under the src-layout package. env.py imports
# personal_os.database.schema.Base.metadata as the single source of
# schema truth; migrations never redefine the application schema
# themselves (ADR-002).
script_location = src/personal_os/database/migrations

# Timestamped, readable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Intentionally blank. See the module docstring above and env.py's
# _resolve_database_url().
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
